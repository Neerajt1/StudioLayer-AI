kind = "web"
previewPath = "/"
title = "StudioLayer AI"
version = "1.0.0"
id = "artifacts/studiolayer-ai"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25562

[services.development]
run = "pnpm --filter @workspace/studiolayer-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/studiolayer-ai", "run", "build" ]
serve = "static"
publicDir = "artifacts/studiolayer-ai/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25562"
BASE_PATH = "/"
