openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: StudioLayer AI API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: renders
    description: Render job operations
  - name: identities
    description: Model identity library
  - name: support
    description: Support ticket operations
  - name: payments
    description: Razorpay membership subscription operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: User registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "204":
          description: Logged out

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/complete-onboarding:
    patch:
      operationId: completeOnboarding
      tags: [auth]
      summary: Mark onboarding as complete for the current user
      responses:
        "200":
          description: Onboarding marked complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/studio:
    delete:
      operationId: deleteStudio
      tags: [auth]
      summary: Permanently delete the authenticated user's Studio
      description: Cancels any active subscription, removes Studio data, deletes the account, and destroys the session.
      responses:
        "204":
          description: Studio deleted
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Deletion could not be completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /renders:
    get:
      operationId: listRenders
      tags: [renders]
      summary: List user's render jobs
      responses:
        "200":
          description: List of renders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Render"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createRender
      tags: [renders]
      summary: Start a new render job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenderInput"
      responses:
        "201":
          description: Render job(s) created — one per requested image
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Render"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Free tier limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /identities:
    get:
      operationId: getIdentities
      tags: [identities]
      summary: List all model identities in the identity library
      responses:
        "200":
          description: Array of identities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Identity"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /renders/usage:
    get:
      operationId: getRenderUsage
      tags: [renders]
      summary: Get render usage stats for the current user
      responses:
        "200":
          description: Usage stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RenderUsage"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /renders/{id}:
    delete:
      operationId: deleteRender
      tags: [renders]
      summary: Delete a render job by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Render deleted
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: getRender
      tags: [renders]
      summary: Get a render job by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Render job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Render"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /support-tickets:
    post:
      operationId: createSupportTicket
      tags: [support]
      summary: Submit a support ticket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportTicketInput"
      responses:
        "201":
          description: Ticket submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportTicket"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /payments/subscriptions:
    post:
      operationId: createMembershipSubscription
      tags: [payments]
      summary: Create a Razorpay membership subscription
      description: >
        Authenticated endpoint that creates a Razorpay subscription for Studio Basic
        or Studio Pro. Maps the StudioLayer plan identifier server-side to the
        configured Razorpay Plan ID. Returns public checkout fields only
        (never RAZORPAY_KEY_SECRET). Credits are granted only via verified webhooks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMembershipSubscriptionInput"
      responses:
        "201":
          description: Subscription created or existing open subscription returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipSubscriptionCheckout"
        "400":
          description: Invalid plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Razorpay upstream failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /payments/subscriptions/membership:
    get:
      operationId: getMembershipSubscriptionStatus
      tags: [payments]
      summary: Get open membership subscription status
      responses:
        "200":
          description: Membership subscription status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipSubscriptionStatus"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /payments/subscriptions/schedule-pro:
    post:
      operationId: scheduleMembershipUpgradeToPro
      tags: [payments]
      summary: Schedule Studio Pro for the next Basic billing date
      description: >
        Authenticated Studio Basic members schedule a separate future-start
        Studio Pro subscription with start_at equal to the live Basic
        current_end. Nothing is charged today. Credits and Pro entitlement
        activate only via the normal Pro subscription.charged webhook.
      responses:
        "201":
          description: Future-start Pro subscription created or existing schedule returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduledMembershipUpgradeCheckout"
        "400":
          description: Not eligible to schedule Studio Pro
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflicting membership state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Razorpay or persistence failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /payments/subscriptions/cancel:
    post:
      operationId: cancelMembershipAtCycleEnd
      tags: [payments]
      summary: Cancel membership renewal at the end of the current billing period
      description: >
        Authenticated paid members request cancel_at_cycle_end on their active
        Razorpay subscription. Membership remains active until current_end.
        The StudioLayer account and Creative Ledger history are preserved.
        Does not pause or immediately cancel an active billing period.
      responses:
        "200":
          description: Renewal cancellation confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipCancellationResult"
        "400":
          description: Not eligible to cancel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Already scheduled to cancel at cycle end
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Razorpay confirmation failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /payments/add-ons/checkout:
    post:
      operationId: createStudioAddOnCheckout
      tags: [payments]
      summary: Create a one-time Razorpay order for Studio Pass or Top-Up
      description: >
        Authenticated endpoint that creates a Razorpay Order (not a subscription)
        for Studio Pass or Studio Top-Up. Server resolves market → amount/currency.
        Credits are granted only via verified payment.captured webhooks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStudioAddOnCheckoutInput"
      responses:
        "201":
          description: Razorpay order created for Checkout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioAddOnCheckout"
        "400":
          description: Invalid product or purchase not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Razorpay upstream failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    Identity:
      type: object
      properties:
        id:
          type: string
        displayName:
          type: string
        gender:
          type: string
          enum: [womens, mens, kids]
        ethnicity:
          type: string
        ageGroup:
          type: string
        imageUrl:
          type: string
      required:
        - id
        - displayName
        - gender
        - ethnicity
        - ageGroup
        - imageUrl

    User:
      type: object
      properties:
        id:
          type: number
        email:
          type: string
        name:
          type: string
        subscriptionTier:
          type: string
          enum: [free, pro, enterprise]
        hasCompletedOnboarding:
          type: boolean
        isAdmin:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - email
        - name
        - subscriptionTier
        - hasCompletedOnboarding
        - isAdmin
        - createdAt

    RegisterInput:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
          minLength: 8
        name:
          type: string
          minLength: 1
      required:
        - email
        - password
        - name

    LoginInput:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required:
        - email
        - password

    Render:
      type: object
      properties:
        id:
          type: number
        userId:
          type: number
        sourceImageUrl:
          type: ["string", "null"]
        outputImageUrl:
          type: ["string", "null"]
        modelPersona:
          type: string
          enum: [casual, high_fashion, athletic, minimalist]
        locationEnvironment:
          type: string
          enum: [photo_studio, white_studio, grey_gradient_studio, urban_street, luxury_interior, nature]
        status:
          type: string
          enum: [pending, processing, completed, failed]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        parentRenderId:
          type: ["number", "null"]
          description: >
            ID of the parent render this was refined from.
            Null for original (non-refinement) renders.
        generationSessionId:
          type: ["string", "null"]
          format: uuid
          description: >
            Canonical generation session identifier. All renders from the same
            Studio generation share this UUID. Refinements inherit the parent
            session. Gallery Shoot identity is derived from this field.
        generationType:
          type: string
          enum: [hero, campaign, editorial]
          description: >
            Workspace generation type — Hero, Campaign, or Editorial.
            Inherited from the parent on refinements.
        studioCreditsUsed:
          type: integer
          description: >
            Studio Credits consumed along the lineage to produce this render.
        refinementCount:
          type: integer
          description: >
            Refinement steps recorded for this render in the Creative Ledger.
        masterRenderId:
          type: ["number", "null"]
          description: >
            ID of the immutable Master Asset this render belongs to.
            Master assets reference themselves.
        assetVersion:
          type: integer
          description: >
            Immutable version number in the asset lineage. Master Asset = 1;
            each refinement increments parent version by 1.
        assetType:
          type: string
          enum:
            - master
            - crop
            - face_enhanced
            - garment_enhanced
            - background_removed
            - upscale
            - colour_corrected
            - print_export
            - story_export
            - legacy_refinement
          description: >
            Explicit asset type — never inferred from filenames or URLs.
        refinementType:
          type: ["string", "null"]
          enum: [remove_background, enhance_model_face, enhance_garment, null]
          description: >
            AI refinement that created this asset, when applicable.
        sourceAssetVersion:
          type: ["integer", "null"]
          description: >
            Version number of the parent asset this was derived from.
        cropPreset:
          type: ["string", "null"]
          enum: [original, portrait, full_body, square, story, landscape, banner, null]
          description: >
            Crop preset for crop variants. No AI metadata required for crops.
        assetLineage:
          type: object
          description: >
            Complete auditable lineage record for this asset (Batch 23A).
          properties:
            masterAssetId:
              type: integer
            parentAssetId:
              type: ["integer", "null"]
            assetVersion:
              type: integer
            assetType:
              type: string
            refinementType:
              type: ["string", "null"]
            sourceAssetVersion:
              type: ["integer", "null"]
            cropPreset:
              type: ["string", "null"]
            createdAt:
              type: ["string", "null"]
              format: date-time
            studioCreditsUsed:
              type: integer
        workspaceId:
          type: number
          description: >
            Studio workspace identifier. Same as userId in Version 1.
      required:
        - id
        - userId
        - sourceImageUrl
        - outputImageUrl
        - modelPersona
        - locationEnvironment
        - status
        - createdAt
        - updatedAt

    RenderInput:
      type: object
      properties:
        sourceImageUrl:
          type: string
          description: >
            URL or path of the uploaded front garment image (required primary reference).
        backImageUrl:
          type: string
          description: >
            Optional URL or path of a back-view garment image.
            Supplementary visual reference only; front (sourceImageUrl) remains authoritative.
        detailImageUrl:
          type: string
          description: >
            Optional URL or path of a detail/close-up garment image.
            Supplementary visual reference only; front (sourceImageUrl) remains authoritative.
        modelPersona:
          type: string
          enum: [casual, high_fashion, athletic, minimalist, high_fashion_editorial, natural_smile, confident_commercial]
        locationEnvironment:
          type: string
          enum: [photo_studio, white_studio, grey_gradient_studio, urban_street, luxury_interior, nature]
        modelDemographics:
          type: string
          enum: [caucasian, east_asian, south_asian, afro_american, hispanic]
        imageDimensions:
          type: string
          enum: [portrait_45, portrait_916, square_11, landscape_169]
        smartLighting:
          type: boolean
        modelPose:
          type: string
          enum: [standing_frontal, walking_dynamic, sideways_posing]
        modelGender:
          type: string
          enum: [mens, womens, kids]
        modelAgeRange:
          type: string
          enum: [young_child, teen_youth, young_adult, classic_mid_age, mature_executive]
        cameraFraming:
          type: string
          enum: [full_body, mid_shot, close_up]
        garmentPlacement:
          type: string
          enum: [upper_body, lower_body, full_body]
        garmentLengthSelection:
          type: string
          enum: [auto, mini, above_knee, knee, midi, mid_calf, maxi, floor]
          description: >
            Garment length for Full Outfit uploads only.
            "auto" (default) uses AI detection from the uploaded image.
            Manual selection overrides auto detection and becomes part of rendering instructions.
        modelIdentityId:
          type: string
        outfitStyle:
          type: string
          description: >
            Complete the Look selection from the UI.
            One of: ai_recommended, formal, business_casual, casual, denim,
            streetwear, ethnic, sportswear, none.
            When present and not "none", the PromptComposer uses the externally
            computed outfit specification instead of its own recommendation.
        imageCount:
          type: integer
          minimum: 1
          maximum: 20
          description: >
            Number of output images to generate.
            Preset shoots: 1 (Hero), 2 (Editorial), or 4 (Campaign).
            When customCampaign is true, must be an integer from 4 to 20.
            Defaults to 1.
        customCampaign:
          type: boolean
          description: >
            When true, generates a Custom Campaign batch at the specified imageCount (4–20).
            Uses Campaign per-image pricing. Campaign preset (imageCount=4 without this flag)
            remains unchanged.
        outputResolution:
          type: string
          enum: [2K, 4K]
          description: >
            Native output resolution selected before generation.
            2K (default) costs 1.5 Studio Credits per successful image.
            4K costs 3 Studio Credits per successful image.
            Refinements ignore this field and continue to cost 1 credit.
        refinementPrompt:
          type: string
          description: >
            Deprecated — use refinementType. Legacy button-label mapping still
            accepted for V1 refinements only.
        refinementType:
          type: string
          enum: [remove_background, enhance_model_face, enhance_garment]
          description: >
            Batch 21 reliable refine selection. Requires parentRenderId.
            Each refinement consumes exactly 1 Studio Credit.
        parentRenderId:
          type: number
          description: >
            ID of the render being refined. When set, the pipeline loads the parent's
            output image as context (Reference Image 3) and treats this request as a
            refinement rather than a fresh generation. Creates a new render row linked
            to the parent for version history.
        usedCameraAngles:
          type: array
          items:
            type: string
          description: >
            Camera Angle Director session memory.
            List of camera angle names already used in this session
            (e.g. ["Straight Front Editorial", "Three-Quarter Left"]).
            When provided, the Camera Angle Director deterministically selects
            the first unused angle from the 12-angle canonical library.
            When absent, the AI visually inspects the reference image and
            selects a different angle. Only relevant when refinementPrompt
            is a camera angle change request.
        usedPoses:
          type: array
          items:
            type: string
          description: >
            Pose Director session memory.
            List of pose names already used in this session
            (e.g. ["Fashion Power Pose", "Walking Towards Camera"]).
            When provided, the Pose Director deterministically selects the
            first garment-appropriate unused pose from the 30-pose canonical
            library. When absent, the AI visually inspects the reference
            image and selects a different pose. Only relevant when
            refinementPrompt is a pose change request.
      required:
        - sourceImageUrl
        - modelPersona
        - locationEnvironment

    RenderUsage:
      type: object
      properties:
        used:
          type: number
          description: Studio Credits consumed in the current billing period (or lifetime for complimentary tier)
        limit:
          type: ["number", "null"]
          description: Studio Credit allowance for the current membership
        tier:
          type: string
          enum: [free, pro, enterprise]
        canRender:
          type: boolean
        isAdmin:
          type: boolean
        remaining:
          type: ["number", "null"]
          description: Studio Credits remaining in the current billing period
        cycleStats:
          $ref: "#/components/schemas/BillingCycleStats"
      required:
        - used
        - limit
        - tier
        - canRender
        - isAdmin

    BillingCycleStats:
      type: object
      properties:
        studioCreditsUsed:
          type: number
        imagesCreated:
          type: number
        averageRefinementsPerImage:
          type: number
      required:
        - studioCreditsUsed
        - imagesCreated
        - averageRefinementsPerImage

    SupportTicketInput:
      type: object
      properties:
        message:
          type: string
          minLength: 10
      required:
        - message

    SupportTicket:
      type: object
      properties:
        id:
          type: number
        userId:
          type: number
        userEmail:
          type: string
        message:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - userEmail
        - message
        - createdAt

    CreateMembershipSubscriptionInput:
      type: object
      properties:
        plan:
          type: string
          enum: [basic, pro]
          description: StudioLayer plan identifier (never a raw Razorpay plan_id)
      required:
        - plan

    MembershipSubscriptionCheckout:
      type: object
      properties:
        subscriptionId:
          type: string
          description: Razorpay subscription id for Checkout
        keyId:
          type: string
          description: Public Razorpay Key ID (never the secret)
        plan:
          type: string
          enum: [basic, pro]
        studioTier:
          type: string
          enum: [pro, enterprise]
          description: Internal DB tier (pro=Basic, enterprise=Pro)
        status:
          type: string
        shortUrl:
          type: ["string", "null"]
      required:
        - subscriptionId
        - keyId
        - plan
        - studioTier
        - status
        - shortUrl

    MembershipSubscriptionStatus:
      type: object
      properties:
        studioPlan:
          type: ["string", "null"]
          enum: [basic, pro, null]
        studioTier:
          type: ["string", "null"]
          enum: [pro, enterprise, null]
        status:
          type: ["string", "null"]
        currentEnd:
          type: ["string", "null"]
          format: date-time
        subscriptionId:
          type: ["string", "null"]
        cancelAtCycleEnd:
          type: boolean
          description: True when renewal cancellation at cycle end was requested
        cancelEffectiveAt:
          type: ["string", "null"]
          format: date-time
          description: Membership remains active until this instant when cancelAtCycleEnd is true
        scheduledPro:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/ScheduledProMembershipStatus"
      required:
        - studioPlan
        - studioTier
        - status
        - currentEnd
        - subscriptionId
        - cancelAtCycleEnd
        - cancelEffectiveAt
        - scheduledPro

