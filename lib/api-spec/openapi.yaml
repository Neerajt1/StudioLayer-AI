openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: StudioLayer AI API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: renders
    description: Render job operations
  - name: support
    description: Support ticket operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: User registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "204":
          description: Logged out

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/complete-onboarding:
    patch:
      operationId: completeOnboarding
      tags: [auth]
      summary: Mark onboarding as complete for the current user
      responses:
        "200":
          description: Onboarding marked complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /renders:
    get:
      operationId: listRenders
      tags: [renders]
      summary: List user's render jobs
      responses:
        "200":
          description: List of renders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Render"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createRender
      tags: [renders]
      summary: Start a new render job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenderInput"
      responses:
        "201":
          description: Render job created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Render"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Free tier limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /renders/usage:
    get:
      operationId: getRenderUsage
      tags: [renders]
      summary: Get render usage stats for the current user
      responses:
        "200":
          description: Usage stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RenderUsage"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /renders/{id}:
    delete:
      operationId: deleteRender
      tags: [renders]
      summary: Delete a render job by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Render deleted
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: getRender
      tags: [renders]
      summary: Get a render job by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Render job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Render"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /support-tickets:
    post:
      operationId: createSupportTicket
      tags: [support]
      summary: Submit a support ticket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportTicketInput"
      responses:
        "201":
          description: Ticket submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportTicket"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    User:
      type: object
      properties:
        id:
          type: number
        email:
          type: string
        name:
          type: string
        subscriptionTier:
          type: string
          enum: [free, pro, enterprise]
        hasCompletedOnboarding:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - email
        - name
        - subscriptionTier
        - hasCompletedOnboarding
        - createdAt

    RegisterInput:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
          minLength: 8
        name:
          type: string
          minLength: 1
      required:
        - email
        - password
        - name

    LoginInput:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required:
        - email
        - password

    Render:
      type: object
      properties:
        id:
          type: number
        userId:
          type: number
        sourceImageUrl:
          type: ["string", "null"]
        outputImageUrl:
          type: ["string", "null"]
        modelPersona:
          type: string
          enum: [casual, high_fashion, athletic, minimalist]
        locationEnvironment:
          type: string
          enum: [photo_studio, urban_street, luxury_interior, nature]
        status:
          type: string
          enum: [pending, processing, completed, failed]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - sourceImageUrl
        - outputImageUrl
        - modelPersona
        - locationEnvironment
        - status
        - createdAt
        - updatedAt

    RenderInput:
      type: object
      properties:
        sourceImageUrl:
          type: string
        modelPersona:
          type: string
          enum: [casual, high_fashion, athletic, minimalist, high_fashion_editorial, natural_smile, confident_commercial]
        locationEnvironment:
          type: string
          enum: [photo_studio, urban_street, luxury_interior, nature]
        modelDemographics:
          type: string
          enum: [caucasian, east_asian, south_asian, afro_american, hispanic]
        imageDimensions:
          type: string
          enum: [portrait_45, portrait_916, square_11, landscape_169]
        smartLighting:
          type: boolean
        modelPose:
          type: string
          enum: [standing_frontal, walking_dynamic, sideways_posing]
      required:
        - sourceImageUrl
        - modelPersona
        - locationEnvironment

    RenderUsage:
      type: object
      properties:
        used:
          type: number
        limit:
          type: ["number", "null"]
        tier:
          type: string
          enum: [free, pro, enterprise]
        canRender:
          type: boolean
      required:
        - used
        - limit
        - tier
        - canRender

    SupportTicketInput:
      type: object
      properties:
        message:
          type: string
          minLength: 10
      required:
        - message

    SupportTicket:
      type: object
      properties:
        id:
          type: number
        userId:
          type: number
        userEmail:
          type: string
        message:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - userEmail
        - message
        - createdAt
